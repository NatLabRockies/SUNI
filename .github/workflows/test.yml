name: test

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: [3.12]
        include:
          - os: ubuntu-latest
            python-version: 3.11
          - os: ubuntu-latest
            python-version: '3.10'

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Dependencies
      working-directory: CLI
      run: |
        python -m pip install --upgrade pip
        python -m pip install ".[test]"
    - name: Run Pytest
      working-directory: CLI
      run: |
        python -m pytest tests -v --disable-warnings --cov-config=.coveragerc --cov=SUNI/suni --cov=SERIQC/seriqc