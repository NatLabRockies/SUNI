[metadata]
name = seriqc
version = 0.0.1
author = 'Adam R. Jensen'
author_email = adam-r-j@hotmail.com
description = SERI QC is a python package for quality controling of solar irradiance data.
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/nrel/seriqc
project_urls =
    Bug Tracker = https://github.com/nrel/seriqc/issues
    Documentation = https://seriqc.readthedocs.io
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: BSD License
    Operating System :: OS Independent
    Topic :: Scientific/Engineering
    Intended Audience :: Science/Research

[options]
packages = seriqc
python_requires = >=3.7
install_requires =
    numpy
    matplotlib
    pandas
    pvlib

[options.extras_require]
test =
    pytest
    pytest-cov
doc =
    sphinx==4.4.0
    myst-nb==0.13.2
    sphinx-book-theme==0.2.0
    pvlib==0.9.0
    pandas==1.3.5

# [tool:pytest]
# addopts = --cov=seriqc --cov-report=term-missing --cov-report=html:htmlcov

[coverage:run]
# don't count the test files themselves towards coverage
omit = seriqc/tests/*, setup.py
